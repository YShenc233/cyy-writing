<!-- 微信公众号文章 HTML 模板 -->
<!-- 使用说明：复制到浏览器打开，Ctrl+A 全选，粘贴到公众号编辑器 -->

<!DOCTYPE html>
<html>
<head>
    <meta charset="UTF-8">
    <title>文章标题</title>
</head>
<body style="font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, 'Helvetica Neue', Arial, sans-serif; max-width: 680px; margin: 0 auto; padding: 20px;">

<!-- 文章标题 -->
<h1 style="font-size: 22px; font-weight: bold; color: #000; text-align: center; margin: 20px 0 30px 0; line-height: 1.4;">
    文章标题
</h1>

<!-- 导语/开头 -->
<p style="font-size: 15px; color: #333; line-height: 1.8; margin: 0 0 20px 0; text-align: justify;">
    这里是文章开头，用 2-3 句话引入主题，吸引读者继续阅读...
</p>

<!-- 小标题 -->
<h2 style="font-size: 17px; font-weight: bold; color: #000; margin: 30px 0 15px 0; padding-left: 10px; border-left: 3px solid #07c160;">
    第一部分标题
</h2>

<!-- 正文段落 -->
<p style="font-size: 15px; color: #333; line-height: 1.8; margin: 0 0 15px 0; text-align: justify;">
    这里是正文内容。微信公众号文章建议使用 15px 字号，1.8 倍行距，颜色 #333 或纯黑，这样阅读体验最佳。
</p>

<!-- 重点强调 -->
<p style="font-size: 15px; color: #333; line-height: 1.8; margin: 0 0 15px 0; text-align: justify;">
    这段话里有<span style="color: #ff6b6b; font-weight: bold;">重点内容</span>需要标红加粗。
</p>

<!-- 引用块 -->
<div style="background: #f7f7f7; border-left: 3px solid #07c160; padding: 15px 20px; margin: 20px 0; font-size: 14px; color: #666; line-height: 1.6;">
    这里是引用内容，可以是名言、数据或者重要提示。
</div>

<!-- 代码块 -->
<div style="background: #f8f9fa; border: 1px solid #e9ecef; border-radius: 4px; padding: 15px; margin: 20px 0; font-family: 'Courier New', monospace; font-size: 13px; color: #333; line-height: 1.5; overflow-x: auto;">
# 代码示例<br>
console.log("Hello WeChat");
</div>

<!-- 列表 -->
<ul style="font-size: 15px; color: #333; line-height: 1.8; margin: 0 0 15px 0; padding-left: 20px;">
    <li style="margin-bottom: 8px;">第一点内容</li>
    <li style="margin-bottom: 8px;">第二点内容</li>
    <li style="margin-bottom: 8px;">第三点内容</li>
</ul>

<!-- 分割线 -->
<hr style="border: none; border-top: 1px solid #e0e0e0; margin: 30px 0;">

<!-- 结尾 -->
<p style="font-size: 15px; color: #333; line-height: 1.8; margin: 0 0 20px 0; text-align: justify;">
    总结全文，给出核心观点...
</p>

<!-- 互动引导 -->
<p style="font-size: 14px; color: #666; line-height: 1.6; margin: 30px 0 0 0; padding: 15px; background: #f7f7f7; border-radius: 4px; text-align: center;">
    💬 <strong>互动话题：</strong>你对这个话题怎么看？欢迎在评论区分享你的观点！
</p>

<!-- 作者信息 -->
<div style="margin-top: 40px; padding-top: 20px; border-top: 1px solid #e0e0e0; text-align: center;">
    <p style="font-size: 13px; color: #999; margin: 0;">
        作者：小陈哥 | 公众号：Siri小陈哥
    </p>
</div>

</body>
</html>
